<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — Dashrath Kunwar</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="Dashrath Kunwar">
  <meta name="theme-color" content="#0c0c0c">
  <link rel="canonical" href="{{canonical}}">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Dashrath Kunwar">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="article:published_time" content="{{date_iso}}">
  <meta property="og:image" content="https://dashrathkunwar.in/og-image-writings.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="https://dashrathkunwar.in/og-image-writings.jpg">

  <!-- Applies the saved theme before first paint. Must stay inline and blocking. -->
  <script>try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>

  <link rel="icon" type="image/png" sizes="96x96" href="../favicon-96x96.png">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="alternate" type="application/rss+xml" title="Dashrath Kunwar" href="../feed.xml">

  <link rel="preload" href="../fonts/roboto-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/unifraktur-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="layout">
    <div class="sidebar">{{sidebar}}</div>

    <div class="main">
      <div class="content" id="main">
        <article class="post">
          <div class="post-header">
            <h1>{{title}}</h1>
            <time datetime="{{date_iso}}">{{date_human}}</time>
          </div>

{{content}}
        </article>

        <!-- The X link works with JavaScript off; the rest reveal themselves. -->
        <div class="share" data-share>
          <span class="share-label">share</span>
          <button type="button" class="btn" data-share-native hidden>share&hellip;</button>
          <a class="btn" href="https://twitter.com/intent/tweet?text={{title_url}}&amp;url={{canonical_url}}"
             target="_blank" rel="noopener noreferrer">post on x</a>
          <button type="button" class="btn" data-share-copy hidden>copy link</button>
          <a class="btn" href="{{slug}}.pdf" download>pdf</a>
          <p class="share-note">Select any passage to copy or share just that part.</p>
        </div>
      </div>

      <footer class="site-footer">
        <p><a href="../writings.html">&larr; all writings</a></p>
      </footer>
    </div>
  </div>

  <script src="../share.js" defer></script>
  <script src="../theme.js" defer></script>
  <script src="../sw-register.js" defer></script>
</body>
</html>
