<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — Dashrath Kunwar</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="Dashrath Kunwar">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="{{canonical}}">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Dashrath Kunwar">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="article:published_time" content="{{date_iso}}">
  <meta property="og:image" content="https://dashrathkunwar.in/og-image-writings.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="https://dashrathkunwar.in/og-image-writings.jpg">

  <!-- Applies the saved theme before first paint. Must stay inline and blocking. -->
  <script>try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>

  <link rel="icon" type="image/png" sizes="96x96" href="../favicon-96x96.png">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="alternate" type="application/rss+xml" title="Dashrath Kunwar — Writings" href="../feed.xml">

  <link rel="preload" href="../fonts/crimson-pro-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/unbounded-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="topbar">
    <button type="button" class="theme-toggle" id="theme-toggle" hidden>☀ Light</button>
  </div>

  <header>
    <nav aria-label="Breadcrumb">
      <ul>
        <li><a href="../index.html">← Home</a></li>
        <li><a href="../writings.html">Writings</a></li>
        <li><a href="../books.html">Books</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <article class="post">
      <div class="post-header">
        <h1>{{title}}</h1>
        <time datetime="{{date_iso}}">{{date_human}}</time>
      </div>

{{content}}
    </article>

    <!-- The X link works with JavaScript off; the rest reveal themselves. -->
    <div class="share" data-share>
      <span class="share-label">Share this essay</span>
      <button type="button" class="share-btn" data-share-native hidden>Share…</button>
      <a class="share-btn" href="https://twitter.com/intent/tweet?text={{title_url}}&amp;url={{canonical_url}}"
         target="_blank" rel="noopener noreferrer">Post on X</a>
      <button type="button" class="share-btn" data-share-copy hidden>Copy link</button>
      <a class="share-btn" href="{{slug}}.pdf" download>Download PDF</a>
      <p class="share-note">Select any passage to copy or share just that part.</p>
    </div>
  </main>

  <footer>
    <p>Hand-written HTML. No frameworks, no trackers, no third parties.</p>
  </footer>

  <script src="../share.js" defer></script>
  <script src="../theme.js" defer></script>
  <script src="../sw-register.js" defer></script>
</body>
</html>
